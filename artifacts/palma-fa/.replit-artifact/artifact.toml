kind = "web"
previewPath = "/"
title = "Palma FA"
version = "1.0.0"
id = "artifacts/palma-fa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19837

[services.development]
run = "pnpm --filter @workspace/palma-fa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/palma-fa", "run", "build" ]
publicDir = "artifacts/palma-fa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19837"
BASE_PATH = "/"

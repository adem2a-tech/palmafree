openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Jobs operations
  - name: illegal
    description: Illegal organizations operations
  - name: staff
    description: Staff members operations
  - name: lore
    description: Lore entries
  - name: patchNotes
    description: Patch notes / nouveautés
  - name: gallery
    description: Galerie images + descriptions
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /illegal:
    get:
      operationId: listIllegalOrgs
      tags: [illegal]
      summary: List all illegal organizations
      responses:
        "200":
          description: List of illegal organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IllegalOrg"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"

  /lore:
    get:
      operationId: listLore
      tags: [lore]
      summary: List lore entries
      responses:
        "200":
          description: List of lore entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoreEntry"

  /patch-notes:
    get:
      operationId: listPatchNotes
      tags: [patchNotes]
      summary: List patch notes (nouveautés)
      responses:
        "200":
          description: List of patch notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatchNote"

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List gallery items (images + descriptions)
      responses:
        "200":
          description: List of gallery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItem"

  /admin/gallery:
    post:
      operationId: createGalleryItem
      tags: [admin]
      summary: Create a gallery item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryItemInput"
      responses:
        "201":
          description: Created gallery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryItem"
        "401":
          description: Unauthorized

  /admin/gallery/{id}:
    patch:
      operationId: updateGalleryItem
      tags: [admin]
      summary: Update a gallery item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryItemUpdate"
      responses:
        "200":
          description: Updated gallery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryItem"
        "401":
          description: Unauthorized
        "404":
          description: Gallery item not found
    delete:
      operationId: deleteGalleryItem
      tags: [admin]
      summary: Delete a gallery item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Gallery item not found

  /admin/patch-notes:
    post:
      operationId: createPatchNote
      tags: [admin]
      summary: Create a patch note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNoteInput"
      responses:
        "201":
          description: Created patch note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchNote"
        "401":
          description: Unauthorized

  /admin/patch-notes/{id}:
    patch:
      operationId: updatePatchNote
      tags: [admin]
      summary: Update a patch note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNoteUpdate"
      responses:
        "200":
          description: Updated patch note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchNote"
        "401":
          description: Unauthorized
        "404":
          description: Patch note not found
    delete:
      operationId: deletePatchNote
      tags: [admin]
      summary: Delete a patch note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Patch note not found

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
        "401":
          description: Unauthorized

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "204":
          description: Logged out

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get current admin status
      responses:
        "200":
          description: Current admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"

  /admin/jobs:
    post:
      operationId: createJob
      tags: [admin]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized

  /admin/jobs/{id}:
    patch:
      operationId: updateJob
      tags: [admin]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized
        "404":
          description: Job not found
    delete:
      operationId: deleteJob
      tags: [admin]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Job not found

  /admin/illegal:
    post:
      operationId: createIllegalOrg
      tags: [admin]
      summary: Create an illegal organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IllegalOrgInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IllegalOrg"
        "401":
          description: Unauthorized

  /admin/illegal/{id}:
    patch:
      operationId: updateIllegalOrg
      tags: [admin]
      summary: Update an illegal organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IllegalOrgUpdate"
      responses:
        "200":
          description: Updated illegal organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IllegalOrg"
        "401":
          description: Unauthorized
        "404":
          description: Illegal organization not found
    delete:
      operationId: deleteIllegalOrg
      tags: [admin]
      summary: Delete an illegal organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Illegal organization not found

  /admin/lore:
    post:
      operationId: createLore
      tags: [admin]
      summary: Create a lore entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoreInput"
      responses:
        "201":
          description: Created lore entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoreEntry"
        "401":
          description: Unauthorized

  /admin/lore/{id}:
    patch:
      operationId: updateLore
      tags: [admin]
      summary: Update a lore entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoreUpdate"
      responses:
        "200":
          description: Updated lore entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoreEntry"
        "401":
          description: Unauthorized
        "404":
          description: Lore entry not found
    delete:
      operationId: deleteLore
      tags: [admin]
      summary: Delete a lore entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Lore entry not found

  /admin/staff:
    get:
      operationId: adminListStaff
      tags: [admin]
      summary: List all staff members (admin)
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
        "401":
          description: Unauthorized
    post:
      operationId: createStaff
      tags: [admin]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "401":
          description: Unauthorized

  /admin/staff/{id}:
    patch:
      operationId: updateStaff
      tags: [admin]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "401":
          description: Unauthorized
        "404":
          description: Staff member not found
    delete:
      operationId: deleteStaff
      tags: [admin]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Staff member not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Job:
      type: object
      required: [id, name, category, available]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        available: { type: boolean }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }

    JobInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { type: string }
        available: { type: boolean }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }

    JobUpdate:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        available: { type: boolean }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }

    IllegalOrg:
      type: object
      required: [id, name, status, activities, segment]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        activities:
          type: array
          items: { type: string }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        segment:
          type: string
          description: Regroupement affiché sur le site (Gang, Organisation, Indépendant).

    IllegalOrgInput:
      type: object
      required: [name, status, activities]
      properties:
        name: { type: string }
        status: { type: string }
        activities:
          type: array
          items: { type: string }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        segment:
          type: string
          description: Gang | Organisation | Indépendant (défaut Organisation si omis).

    IllegalOrgUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        activities:
          type: array
          items: { type: string }
        discordLink: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        segment: { type: string }

    LoreEntry:
      type: object
      required: [id, title, summary, sortOrder]
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }

    LoreInput:
      type: object
      required: [title, summary]
      properties:
        title: { type: string }
        summary: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }

    LoreUpdate:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }

    PatchNote:
      type: object
      required: [id, version, date, category, changes, sortOrder]
      properties:
        id: { type: integer }
        version: { type: string }
        date: { type: string }
        category: { type: string }
        changes:
          type: array
          items: { type: string }
        sortOrder: { type: integer }

    PatchNoteInput:
      type: object
      required: [version, date, category, changes]
      properties:
        version: { type: string }
        date: { type: string }
        category: { type: string }
        changes:
          type: array
          items: { type: string }
        sortOrder: { type: integer }

    PatchNoteUpdate:
      type: object
      properties:
        version: { type: string }
        date: { type: string }
        category: { type: string }
        changes:
          type: array
          items: { type: string }
        sortOrder: { type: integer }

    GalleryItem:
      type: object
      required: [id, imageUrl, description, sortOrder]
      properties:
        id: { type: integer }
        imageUrl: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    GalleryItemInput:
      type: object
      required: [imageUrl, description]
      properties:
        imageUrl: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    GalleryItemUpdate:
      type: object
      properties:
        imageUrl: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    Staff:
      type: object
      required: [id, pseudo, role, description, category, sortOrder]
      properties:
        id: { type: integer }
        pseudo: { type: string }
        role: { type: string }
        description: { type: string }
        category: { type: string }
        avatarUrl: { type: ["string", "null"] }
        sortOrder: { type: integer }

    StaffInput:
      type: object
      required: [pseudo, role, description, category]
      properties:
        pseudo: { type: string }
        role: { type: string }
        description: { type: string }
        category: { type: string }
        avatarUrl: { type: ["string", "null"] }
        sortOrder: { type: integer }

    StaffUpdate:
      type: object
      properties:
        pseudo: { type: string }
        role: { type: string }
        description: { type: string }
        category: { type: string }
        avatarUrl: { type: ["string", "null"] }
        sortOrder: { type: integer }

    AdminLoginInput:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password: { type: string }

    AdminMe:
      type: object
      required: [loggedIn]
      properties:
        loggedIn: { type: boolean }
